[package]
name = "dog-translate"
version = "0.1.2"
edition = "2024"
description = "A fast screen-region translator using OS OCR with ChatGPT or Claude account login"
license = "Apache-2.0"
repository = "https://github.com/11kkw/dog-translate"
readme = "README.md"

[dependencies]
anyhow = "1.0"
arboard = "3.6.1"
eframe = { version = "0.35.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
] }
futures = "0.3"
global-hotkey = "0.8.0"
xcap = "0.9.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52.0", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSString",
] }
objc2-vision = { version = "0.3.2", default-features = false, features = [
    "std",
    "VNObservation",
    "VNRecognizeTextRequest",
    "VNRequest",
    "VNRequestHandler",
    "objc2-core-foundation",
] }
screencapturekit = { version = "9.0.1", features = ["macos_14_0"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
