name: Build macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-apple-silicon:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - name: Install native Codex runtime
        run: npm install --global @openai/codex@0.147.0

      - name: Build Apple Silicon app, ZIP, and DMG
        run: |
          chmod +x scripts/package-macos.sh scripts/package-macos-apple-silicon.sh
          ./scripts/package-macos-apple-silicon.sh

      - name: Verify bundle architecture and signature
        run: |
          file dist/DogTranslate.app/Contents/MacOS/DogTranslate | grep arm64
          file dist/DogTranslate.app/Contents/MacOS/providers/codex | grep arm64
          codesign --verify --deep --strict --verbose=2 dist/DogTranslate.app

      - name: Upload Apple Silicon distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DogTranslate-macOS-AppleSilicon
          path: |
            dist/DogTranslate-*-macOS-AppleSilicon.dmg
            dist/DogTranslate-*-macOS-AppleSilicon.zip
          if-no-files-found: error
          retention-days: 30
